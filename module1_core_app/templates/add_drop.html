<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add / Drop Courses</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f4f6f9;
      display: flex;
      flex-direction: row;
    }

    h1 {
      background: #34495e;
      color: white;
      padding: 20px 0;
      margin: 0;
      width: 100%;
      text-align: center;
    }

    .container {
      margin: 30px;
      width: 60%;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 30px;
      background: white;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      border-radius: 6px;
      overflow: hidden;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }

    th {
      background: #2c3e50;
      color: white;
    }

    tr:hover {
      background: #f1f1f1;
    }

    .btn {
      background: #2ecc71;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      margin: 2px;
      transition: background 0.2s;
    }

    .btn:hover {
      background: #27ae60;
    }

    .delete-btn {
      background: #e74c3c;
    }

    .delete-btn:hover {
      background: #c0392b;
    }

    .right-panel {
      margin: 30px;
      flex-grow: 1;
      display: flex;
      align-items: flex-start;
      justify-content: flex-end;
    }

    .add-btn {
      background: #3498db;
      padding: 14px 20px;
      font-size: 16px;
    }

    /* Modal styles */
    .modal {
      display: none;
      position: fixed;
      z-index: 1;
      left: 0; top: 0;
      width: 100%; height: 100%;
      background-color: rgba(0,0,0,0.5);
    }

    .modal-content {
      background: #fff;
      margin: 10% auto;
      padding: 20px;
      border-radius: 8px;
      width: 400px;
      text-align: left;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    }

    .modal-content h2 {
      margin-top: 0;
    }

    .modal-content label {
      display: block;
      margin-top: 10px;
    }

    .modal-content input {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .error {
      color: red;
      font-size: 13px;
      margin-top: 5px;
    }

    .close {
      float: right;
      cursor: pointer;
      font-size: 20px;
      font-weight: bold;
      color: #aaa;
    }
    .close:hover {
      color: black;
    }
  </style>
</head>
<body>
  <div style="width:100%">
    <h1>Add / Drop Courses</h1>
    <div class="container">
      <!-- Course Table -->
      <table>
        <tr>
          <th>Course Name</th>
          <th>Database Column</th>
          <th>Actions</th>
        </tr>
        {% for course in courses %}
        <tr>
          <td>{{ course.name }}</td>
          <td>{{ course.column_name }}</td>
          <td>
            <button class="btn" onclick="openEditModal('{{ course.name }}', '{{ course.column_name }}')">Edit</button>
              <button class="btn delete-btn" onclick="deleteCourse('{{ course.name }}', '{{ course.column_name }}')">Delete</button>
          </td>
        </tr>
        {% endfor %}
      </table>
    </div>

    <!-- Right Panel -->
    <div class="right-panel">
      <button class="btn" style="float: right; margin: 20px;" onclick="openAddModal()">➕ Add New Course</button>

    </div>
  </div>

  <!-- Edit Modal -->
  <div id="editModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeEditModal()">&times;</span>
      <h2>Edit Course</h2>

      <p><strong>Old Course Name:</strong> <span id="oldCourseName"></span></p>
      <label>New Course Name:</label>
      <input type="text" id="newCourseName">
      <div id="nameError" class="error"></div>

      <p><strong>Old DB Column:</strong> <span id="oldColumnName"></span></p>
      <label>New DB Column:</label>
      <input type="text" id="newColumnName">
      <div id="columnError" class="error"></div>

      <br>
      <button class="btn" onclick="validateAndSubmit()">Submit</button>
    </div>
  </div>

  <!-- Add Course Modal -->
<div id="addModal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeAddModal()">&times;</span>
    <h2>Add New Course</h2>

    <label>Course Type:</label>
    <select id="addCourseType">
      <option value="">-- Select Course Type --</option>
      <option value="theory">Theory</option>
      <option value="lab">Lab</option>
    </select>
    <div id="addTypeError" class="error"></div>

    <label>Course Name:</label>
    <input type="text" id="addCourseName" placeholder="e.g., Data Structures Lab">
    <div id="addNameError" class="error"></div>

    <label>Database Column Name:</label>
    <input type="text" id="addColumnName" placeholder="e.g., data_structures_lab">
    <div id="addColumnError" class="error"></div>

    <br>
    <button class="btn" onclick="validateAndAdd()">Submit</button>
  </div>
</div>


  <script>


     function openAddModal() {
        document.getElementById("addModal").style.display = "block";
    }

    function closeAddModal() {
        document.getElementById("addModal").style.display = "none";
    }

    function validateAndAdd() {
  let courseType = document.getElementById("addCourseType").value.trim();
  let courseName = document.getElementById("addCourseName").value.trim();
  let columnName = document.getElementById("addColumnName").value.trim();

  let valid = true;

  // Reset error messages
  document.getElementById("addTypeError").innerText = "";
  document.getElementById("addNameError").innerText = "";
  document.getElementById("addColumnError").innerText = "";

  // Validate Course Type
  if (!courseType) {
    document.getElementById("addTypeError").innerText = "Please select a course type.";
    valid = false;
  }

  // Validate Course Name
  if (!courseName) {
    document.getElementById("addNameError").innerText = "Course name cannot be empty.";
    valid = false;
  } else if (courseName.length > 50) {
    document.getElementById("addNameError").innerText = "Course name must be ≤ 50 characters.";
    valid = false;
  } else if (courseType === "lab" && !courseName.toLowerCase().endsWith("lab")) {
    document.getElementById("addNameError").innerText = "Lab course name must end with 'Lab' (e.g., Data Structures Lab).";
    valid = false;
  }

  // Validate Database Column
  if (!columnName) {
    document.getElementById("addColumnError").innerText = "DB column name cannot be empty.";
    valid = false;
  } else if (/\s/.test(columnName)) {
    document.getElementById("addColumnError").innerText = "DB column name cannot contain spaces.";
    valid = false;
  } else if (columnName.length > 50) {
    document.getElementById("addColumnError").innerText = "DB column name must be ≤ 50 characters.";
    valid = false;
  } else if (courseType === "lab" && !columnName.toLowerCase().endsWith("_lab")) {
    document.getElementById("addColumnError").innerText = "Lab course column must end with '_lab' (e.g., data_structures_lab).";
    valid = false;
  }

  if (!valid) return;

  // Send data to backend
  fetch("/add_course", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      course_type: courseType,
      course_name: courseName,
      column_name: columnName
    })
  })
  .then(res => res.json())
  .then(data => {
    alert(data.message);
    if (data.success) {
      window.location.reload();
    }
  })
  .catch(err => {
    console.error(err);
    alert("Error adding course!");
  });
}

    



    function deleteCourse(courseName, columnName) {
        if (!confirm(`⚠ Are you sure you want to delete the course "${courseName}"? This will also remove the column "${columnName}" from student_studied_courses.`)) {
        return;
        }

        fetch("/delete_course", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            course_name: courseName,
            column_name: columnName
        })
        })
        .then(res => res.json())
        .then(data => {
        alert(data.message);
        if (data.success) {
            window.location.reload();
        }
        })
        .catch(err => {
        console.error(err);
        alert("Error deleting course!");
        });
    }
    function openEditModal(courseName, columnName) {
      document.getElementById("oldCourseName").innerText = courseName;
      document.getElementById("oldColumnName").innerText = columnName;
      document.getElementById("newCourseName").value = "";
      document.getElementById("newColumnName").value = "";
      document.getElementById("nameError").innerText = "";
      document.getElementById("columnError").innerText = "";
      document.getElementById("editModal").style.display = "block";
    }

    function closeEditModal() {
      document.getElementById("editModal").style.display = "none";
    }

    function validateAndSubmit() {
        let name = document.getElementById("newCourseName").value.trim();
        let column = document.getElementById("newColumnName").value.trim();
        let oldCourse = document.getElementById("oldCourseName").innerText;
        let oldColumn = document.getElementById("oldColumnName").innerText;

        let valid = true;
        document.getElementById("nameError").innerText = "";
        document.getElementById("columnError").innerText = "";

        if (!name) {
        document.getElementById("nameError").innerText = "Course name cannot be empty.";
        valid = false;
        } else if (name.length > 50) {
        document.getElementById("nameError").innerText = "Course name cannot exceed 50 characters.";
        valid = false;
        }

        if (!column) {
        document.getElementById("columnError").innerText = "Database column cannot be empty.";
        valid = false;
        } else if (/\s/.test(column)) {
        document.getElementById("columnError").innerText = "Database column cannot contain spaces.";
        valid = false;
        } else if (column.length > 50) {
        document.getElementById("columnError").innerText = "Database column cannot exceed 50 characters.";
        valid = false;
        }

        if (valid) {
        // Send data to Flask
        fetch("/update_course", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
            old_course_name: oldCourse,
            new_course_name: name,
            old_column_name: oldColumn,
            new_column_name: column
            })
        })
        .then(res => res.json())
        .then(data => {
            alert(data.message);
            if (data.success) {
            window.location.reload(); // Refresh page on success
            }
        })
        .catch(err => {
            console.error(err);
            alert("Error updating course!");
        });

        closeEditModal();
        }
    }

    // Close modal if clicked outside
    window.onclick = function(event) {
      let modal = document.getElementById("editModal");
      if (event.target === modal) {
        modal.style.display = "none";
      }
    }

    // Push a dummy history state
  history.pushState(null, "", location.href);
  window.onpopstate = function () {
    window.location.href = "/go_home";
  };
  </script>
</body>
</html>
