<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>View Student Exam Artifacts</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root {
  --bg: #e0e4e8;
  --card: #f9f9fb;
  --accent: #4a90e2;
  --muted: #555;
  --radius: 16px;
  --shadow: 4px 4px 12px rgba(0,0,0,0.1), -4px -4px 12px rgba(255,255,255,0.7);
  font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--muted);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px;
}

.container {
  width: 100%;
  max-width: 700px;
  background: linear-gradient(145deg, #ffffff, #e3e6eb);
  padding: 40px;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  border: 1px solid rgba(0,0,0,0.05);
}

h1 {
  font-size: 26px;
  font-weight: 800;
  margin: 0 0 10px 0;
  color: #222;
  text-align: center;
}

p.subtitle {
  text-align: center;
  margin-bottom: 30px;
  color: #666;
  font-size: 14px;
}

.file-link {
  display: flex;
  align-items: center;
  background: white;
  padding: 16px 24px;
  margin-bottom: 12px;
  border-radius: 12px;
  text-decoration: none;
  color: #222;
  font-weight: 600;
  transition: 0.3s ease;
  border: 1px solid rgba(0,0,0,0.05);
  box-shadow: 2px 2px 5px rgba(0,0,0,0.02);
}

.file-link:hover {
  background: #f8f9fa;
  color: var(--accent);
  transform: translateY(-2px);
  box-shadow: 4px 4px 10px rgba(0,0,0,0.05);
  border-color: var(--accent);
}

.file-icon {
  margin-right: 15px;
  font-size: 1.4em;
  background: #f1f3f5;
  width: 45px;
  height: 45px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 10px;
}
</style>
</head>
<body>
<div class="container">
  <h1>Exam Proctor Assets</h1>
  <p class="subtitle">Select a file below to verify student examination properties.</p>
  
  {% for file in files %}
    <a target="_blank" href="/view_submission/{{ base_path | replace('\\', '/') }}/{{ file }}" class="file-link">
      <span class="file-icon">
        {% if file.endswith('.mp4') %}🎥
        {% elif file.endswith('.wav') %}🎵
        {% elif file.endswith('.txt') or file.endswith('.json') %}📄
        {% else %}📁{% endif %}
      </span>
      <span>{{ file }}</span>
    </a>
  {% endfor %}
</div>
</body>
</html>
